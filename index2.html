<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />

    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <style>
        :root {
            color-scheme: dark;
        }

        html,
        body {
            margin: 0;
            height: 100dvh;
            background: #000;
            color: #eaeef5;
            font-family: system-ui, Segoe UI, Roboto, sans-serif;
            overflow: hidden;
        }

        header {
            position: fixed;
            top: 10px;
            left: 20px;
            padding: 10px 14px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            background: color-mix(in srgb, #0b0f1a 60%, transparent);
            border: 1px solid #1f2840;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
            backdrop-filter: blur(6px);
            z-index: 20;
        }

        button {
            padding: 8px 12px;
            border-radius: 10px;

        }

        }

            position: fixed;
            inset: 0;

            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(1200px 600px at 50% -10%, #101a33 0%, rgba(11, 15, 26, 0.9) 40%, #0b0f1a 70%);

            background: #18203a;
            border-radius: 4px;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            width: 0%;
            background: #2a60ff;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff5566;
        }

        .dot.on {
            background: #5aff7a;
        }

        @media (max-width:640px) {
            header {
                left: 8px;
                right: 8px;
                top: 8px;
                justify-content: space-between
            }
        }

        canvas {
            pointer-events: none;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.min.js"></script>

</head>

<body>
    <header>
        <button id="btnConnect">Connect mic</button>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
        import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';
        import { KTX2Loader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/KTX2Loader.js';
        import { MeshoptDecoder } from 'meshopt-decoder';
        import { Conversation } from '@elevenlabs/client';

        // ---------- CONFIG ----------
        const AGENT_ID = 'agent_5501k5ckwydxem1s0sdzjj17ej9m';
        const WP_BASE = 'https://test-ai.garabatoweb.com';

        // RUTAS CANDIDATAS (se probarán en orden hasta que una funcione)
        const GLB_CANDIDATES = [
            '2.glb', './2.glb', '/2.glb',
            '/public/2.glb', '/assets/2.glb'
        ];

        const BOX_URL = './caja.glb';
        const BOX_TEXTURE_URL = './T_Side_Box_BaseColor.png';
        const TEETH_TEXTURE_URL = './T_Theets_BaseColor.png';

        const BOX_TEXTURE_REPEAT = { x: 1, y: 1 };
        const BOX_USE_TRANSPARENCY = false;
        const BOX_OPACITY = 1.0;

        const BOX_SCALE = { x: 0.51, y: 0.27, z: 1.00 };
        const BOX_OFFSET_MODE = 'ratio';
        const BOX_OFFSET = { x: 0.00, y: 0.36, z: 0.00 };
        const BOX_WIREFRAME = false;
        const BOX_ROT_INIT = { x: 0, y: 0, z: 0, degrees: false };

        const DOOR_HINTS = ['Puerta', 'PUERTA', 'Door', 'DOOR'];
        const DOOR_ALIGN = 'none';
        const DOOR_OFFSET_MODE = 'ratio';
        const DOOR_OFFSET = { x: 0.0, y: 0.90, z: 0.0 };

        const TALK_SOURCE = 'auto';
        const TALK_NAME_HINTS = ['talk', 'habla', 'speak', 'lip', 'mouth', 'viseme', 'phoneme'];

        const ENABLE_IDLE_SWAY = false;

        const USE_MIXER_MOUTH = true;
        const MOUTH_MIXER_WHEN_TALK = 0.55;
        const MOUTH_MIXER_WHEN_SILENT = 0.5;
        const MOUTH_MANUAL_WHEN_TALK = 0.55;
        const MOUTH_MANUAL_WHEN_SILENT = 0.5;

        const ALWAYS_CENTER_INIT = true;
        const VIEW = { faceFront: true, targetYOffsetRatio: 0.36, fitPadding: 0.65, extraBack: 0.34, targetXOffsetRatio: 0.10 };
        const FOV = 40;
        const FIGURE_TILT_DEG = { x: -12, y: 0, z: 0 };

        const TONGUE_CFG = { MIN_OPEN: 0.28, CURL_DEG: 14, WAG_DEG: 4, WAG_SPD: 2.6, ALLOW_FORWARD: true, MAX_FORWARD: 0.006, UP_OFFSET: 0.010, SAFETY_CLEARANCE: 0.003 };
        const TONGUE_FORWARD_DIR = 'posZ';

        // ---------- ESCENA ----------
        const canvas = document.getElementById('stage');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, /Mobi|Android/i.test(navigator.userAgent) ? 1.5 : 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 2.85;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(/Mobi|Android/i.test(navigator.userAgent) ? 40 : FOV, 1, 0.01, 1000);
        camera.position.set(3, 1.6, 4);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.enablePan = false; controls.enableZoom = false;

        const pivot = new THREE.Group(); scene.add(pivot);

        // 4:3 letterbox
        function fitCanvas43() {
            const W = innerWidth, H = innerHeight, ar = 4 / 3;
            let w, h; if (W / H > ar) { h = H; w = Math.round(h * ar); } else { w = W; h = Math.round(w / ar); }
            renderer.setSize(w, h, false);
            Object.assign(canvas.style, { left: ((W - w) >> 1) + 'px', top: ((H - h) >> 1) + 'px', right: 'auto', bottom: 'auto', width: w + 'px', height: h + 'px' });
            camera.aspect = w / h; camera.fov = /Mobi|Android/i.test(navigator.userAgent) ? 40 : FOV; camera.updateProjectionMatrix();
        }
        canvas.addEventListener('wheel', e => e.preventDefault(), { passive: false });
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => addEventListener(ev, e => e.preventDefault(), { passive: false }));

        let avatar = null, containerBox = null, containerBoxPivot = null;

        // Texturas
        const texLoader = new THREE.TextureLoader();
        let boxTex = null, teethTex = null;
        if (BOX_TEXTURE_URL) { boxTex = texLoader.load(BOX_TEXTURE_URL); boxTex.colorSpace = THREE.SRGBColorSpace; boxTex.wrapS = boxTex.wrapT = THREE.RepeatWrapping; boxTex.repeat.set(BOX_TEXTURE_REPEAT.x, BOX_TEXTURE_REPEAT.y); boxTex.anisotropy = renderer.capabilities.getMaxAnisotropy?.() || 1; }
        if (TEETH_TEXTURE_URL) { teethTex = texLoader.load(TEETH_TEXTURE_URL); teethTex.colorSpace = THREE.SRGBColorSpace; teethTex.anisotropy = renderer.capabilities.getMaxAnisotropy?.() || 1; }

        function onResize() { fitCanvas43(); if (avatar) frameToView(avatar, VIEW); }
        addEventListener('resize', onResize, { passive: true });
        addEventListener('orientationchange', onResize, { passive: true });

        // ---------- HELPERS ----------
        const clamp01 = x => Math.min(1, Math.max(0, x));
        const disableFrustumCulling = root => root.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
        const findExact = (root, name) => { let f = null; root.traverse(o => { if (!f && o.name === name) f = o; }); return f; };
        const findRegex = (root, rx) => { const out = []; root.traverse(o => { if (rx.test(o.name || '')) out.push(o); }); return out; };
        const findAnyByNames = (root, names = []) => { for (const n of names) { const x = findExact(root, n); if (x) return x; } return null; };
        const worldToLocal = (obj, v) => obj.parent ? obj.parent.worldToLocal(v.clone()) : v.clone();

        const restQ = new Map(), restP = new Map();
        const saveRest = o => { if (!o) return; if (!restQ.has(o)) restQ.set(o, o.quaternion.clone()); if (!restP.has(o)) restP.set(o, o.position.clone()); };
        const restore = o => { if (!o) return; const q = restQ.get(o), p = restP.get(o); if (q) o.quaternion.copy(q); if (p) o.position.copy(p); };
        const rot = (n, ax, r) => { if (!n) return; restore(n); const q = new THREE.Quaternion().setFromAxisAngle(ax, r); n.quaternion.multiply(q).normalize(); };
        const mov = (n, dx = 0, dy = 0, dz = 0) => { if (!n) return; restore(n); n.position.x += dx; n.position.y += dy; n.position.z += dz; };
        const addRot = (n, ax, r) => { if (!n || r === 0) return; const q = new THREE.Quaternion().setFromAxisAngle(ax, r); n.quaternion.multiply(q).normalize(); };
        const addMov = (n, dx = 0, dy = 0, dz = 0) => { if (!n) return; n.position.x += dx; n.position.y += dy; n.position.z += dz; };
        const copyPose = (from, to) => { if (!from || !to) return; to.position.copy(from.position); to.quaternion.copy(from.quaternion); };

        function computeRobustBounds(root) {
            root.updateMatrixWorld(true);
            const box = new THREE.Box3(); let found = false;
            root.traverse(o => {
                if (o.isMesh || o.isSkinnedMesh) {
                    const g = o.geometry; if (g) {
                        if (!g.boundingBox) g.computeBoundingBox();
                        const bb = g.boundingBox?.clone();
                        if (bb && isFinite(bb.min.x) && isFinite(bb.max.x)) { bb.applyMatrix4(o.matrixWorld); box.union(bb); found = true; }
                    }
                }
                if (o.isBone) { const p = new THREE.Vector3(); o.getWorldPosition(p); box.expandByPoint(p); found = true; }
            });
            if (!found || !isFinite(box.min.x) || !isFinite(box.max.x)) return null;
            const sphere = box.getBoundingSphere(new THREE.Sphere());
            return { box, sphere };
        }
        const computeBaseSphere = o => (computeRobustBounds(o)?.sphere ?? null);
        function normalizeAndCenter(object) {
            const b = computeRobustBounds(object); if (!b) { console.warn('[bounds] no se pudo calcular'); return; }
            const { box, sphere } = b; const size = box.getSize(new THREE.Vector3());
            const maxSide = Math.max(size.x, size.y, size.z); const center = sphere.center;
            object.position.x -= center.x; object.position.z -= center.z;
            const target = 2.5; if (maxSide < 0.05 || maxSide > 50) object.scale.multiplyScalar(target / maxSide);
            object.userData.baseSphere = sphere;
        }

        // ---------- RIG ----------
        let ROOT = null, DEF_HEAD = null, CTRL_HEAD_UP = null;
        let CTRL_MOUTH = null, CTRL_JAW = null, DEF_JAW = null;
        let TEETH_LOWER = null, TEETH_UPPER = null;
        let LIP_UP = [], LIP_DOWN = [], LIP_UP_CORNERS = [], LIP_UP_CENTER = [], LIP_DOWN_CORNERS = [], LIP_DOWN_CENTER = [];
        let OJO_L = null, OJO_R = null, TONGUE = [];
        let mouthOpenMorph = null;

        // ---------- UI ----------
        const statusEl = document.getElementById('status');
        const btnConnect = document.getElementById('btnConnect');
        const btnDisconnect = document.getElementById('btnDisconnect');
        const micSelect = document.getElementById('micSelect');
        const btnTestTalk = document.getElementById('btnTestTalk');
        const statusElSet = t => statusEl.textContent = t;
        const lvlTxt = document.getElementById('lvlTxt');
        const lvlBar = document.getElementById('lvlBar');
        const talkDot = document.getElementById('talkDot');
        const openTxt = document.getElementById('openTxt');

        // ---------- CARGA (GLB) ----------
        // Manager para ver errores de recursos
        const manager = new THREE.LoadingManager();
        manager.onError = (url) => console.error('Fallo cargando recurso:', url);

        const loader = new GLTFLoader(manager);
        const draco = new DRACOLoader(); draco.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/'); loader.setDRACOLoader(draco);
        const ktx2 = new KTX2Loader().setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/'); ktx2.detectSupport(renderer); loader.setKTX2Loader(ktx2);
        loader.setMeshoptDecoder(MeshoptDecoder);

        let mixer = null, clock = null, actionBody = null, actionMouth = null, actionTalk = null;

        const RX = {
            jaw: /(CTRL|DEF)?[_-]?(jaw|mandible|quijada|mand[ií]bula)/i,
            teethLower: /(teeth|tooth|dientes|inferior|lower|bottom).*?(down|low|inferior)?/i,
            teethUpper: /(teeth|tooth|dientes|superior|upper|top).*?(up|upper|superior)?/i,
            lipAny: /\b(lip|labio|mouth.*lip)\b/i,
            lipDown: /(lip[_ -]?down|lower[_ -]?lip|labio[_ -]?inf)/i,
            lipUp: /(lip(?!.*down)|upper[_ -]?lip|labio[_ -]?sup)/i,
            eyeL: /(eye.*(L|_L|\.L)|ojo.*(L|_L|\.L))/i,
            eyeR: /(eye.*(R|_R|\.R)|ojo.*(R|_R|\.R))/i,
            tongue: /(tongue|lengua)/i,
            mouthOpenMorph: /(mouth[_ ]?open|jaw[_ ]?open|viseme[_ ]?AA?H?|AA?H?|openMouth)/i,
        };
        const isCorner = n => /\.L\b|_L\b|\bL\b|\.R\b|_R\b|\bR\b/i.test(n.name) || /corner/i.test(n.name);

        // Intento secuencial de múltiples rutas para el GLB
        function loadGLBWithFallbacks(candidates) {
            return new Promise(async (resolve, reject) => {
                for (const raw of candidates) {
                    const url = new URL(raw, location.href).href;
                    console.log('[GLB] Probando:', url);
                    try {
                        const gltf = await new Promise((res, rej) => loader.load(url, res, undefined, rej));
                        console.log('[GLB] OK:', url);
                        resolve({ gltf, url }); return;
                    } catch (err) {
                        console.warn('[GLB] Falló:', url, err?.message || err);
                    }
                }
                reject(new Error('Ninguna ruta de GLB fue válida (404/servido/permiso).'));
            });
        }

        try {
            const { gltf, url: GLB_URL } = await loadGLBWithFallbacks(GLB_CANDIDATES);

            avatar = gltf.scene; if (!avatar) throw new Error('GLB sin escena');
            normalizeAndCenter(avatar); disableFrustumCulling(avatar); pivot.add(avatar);

            // Saneo materiales
            avatar.traverse(o => {
                if (o.visible === false) o.visible = true;
                if (o.isMesh || o.isSkinnedMesh) {
                    const mats = Array.isArray(o.material) ? o.material : [o.material];
                    for (const m of mats) {
                        if (!m) continue;
                        if (m.opacity === 0) m.opacity = 1;
                        if (m.transparent && m.opacity >= 1) m.transparent = false;
                        if ('side' in m) m.side = THREE.DoubleSide;
                        if ('roughness' in m) m.roughness = Math.min(0.65, Math.max(0.0, m.roughness ?? 0.5));
                        if ('metalness' in m) m.metalness = Math.min(0.45, Math.max(0.0, m.metalness ?? 0.05));
                        m.depthWrite = true; m.needsUpdate = true;
                    }
                }
            });

            if (!avatar.userData.baseSphere) { const s = computeBaseSphere(avatar); if (s) avatar.userData.baseSphere = s; }

            // RIG
            ROOT = findAnyByNames(avatar, ['ROOT']) || findRegex(avatar, /\bKRANG_RIG\b/i)[0] || avatar;
            DEF_HEAD = findAnyByNames(avatar, ['DEF_HEAD_UP', 'DEF_HEAD']) || findRegex(avatar, /DEF[_-]?HEAD/i)[0] || null;
            CTRL_JAW = findAnyByNames(avatar, ['CTRL_JAW']) || findRegex(avatar, RX.jaw)[0] || null;
            DEF_JAW = findAnyByNames(avatar, ['DEF_JAW']) || findRegex(avatar, RX.jaw)[0] || null;
            CTRL_MOUTH = findAnyByNames(avatar, ['CTRL_MOUTH', 'MOUTH_CTRL']) || null;

            const teethLowerNodes = findRegex(avatar, RX.teethLower);
            TEETH_LOWER = teethLowerNodes.find(n => n.isBone) || teethLowerNodes.find(n => n.isObject3D) || null;
            const teethUpperNodes = findRegex(avatar, RX.teethUpper);
            TEETH_UPPER = teethUpperNodes.find(n => n.isBone) || teethUpperNodes.find(n => n.isObject3D) || null;

            const lipsAll = findRegex(avatar, RX.lipAny);
            const lipsDown = lipsAll.filter(n => RX.lipDown.test(n.name) || /DOWN/i.test(n.name));
            const lipsUp = lipsAll.filter(n => RX.lipUp.test(n.name) || (!/DOWN/i.test(n.name) && !RX.lipDown.test(n.name)));
            LIP_DOWN = lipsDown.length ? lipsDown : findRegex(avatar, /\bDEF_LIP[_-]?DOWN/i);
            LIP_UP = lipsUp.length ? lipsUp : findRegex(avatar, /\bDEF_LIP(?![_-]?DOWN)/i);

            LIP_UP_CORNERS = (LIP_UP || []).filter(isCorner);
            LIP_UP_CENTER = (LIP_UP || []).filter(n => !isCorner(n));
            LIP_DOWN_CORNERS = (LIP_DOWN || []).filter(isCorner);
            LIP_DOWN_CENTER = (LIP_DOWN || []).filter(n => !isCorner(n));

            OJO_L = findRegex(avatar, RX.eyeL)[0] || null;
            OJO_R = findRegex(avatar, RX.eyeR)[0] || null;

            const tongueRaw = findRegex(avatar, RX.tongue);
            TONGUE = tongueRaw.slice().sort((a, b) => ((parseInt((a.name.match(/(\d+)/) || [])[1] || '0', 10)) - (parseInt((b.name.match(/(\d+)/) || [])[1] || '0', 10))));

            mouthOpenMorph = detectMouthOpenMorph(avatar);

            ;[ROOT, DEF_HEAD, CTRL_MOUTH, CTRL_JAW, DEF_JAW, TEETH_LOWER, TEETH_UPPER, OJO_L, OJO_R, ...LIP_UP, ...LIP_DOWN, ...TONGUE].forEach(saveRest);

            // Encuadre + entorno
            onResize(); frameToView(avatar, VIEW);
            addCinematicLights(avatar); buildShadowReceiversAround(avatar);
            const tmpBox = computeRobustBounds(avatar)?.box;
            if (tmpBox) { const sz = tmpBox.getSize(new THREE.Vector3()).y; controls.target.y -= 0.08 * sz; } else controls.target.y -= 0.1;
            camera.position.y -= 0.05; controls.update();

            if (teethTex) applyTeethTexture(avatar, teethTex);
            addContainerBoxFor(avatar).catch(() => { });

            document.getElementById('loader').style.display = 'none';
            document.getElementById('hud').style.display = 'none';

            // Animaciones / clips
            if (gltf.animations && gltf.animations.length) {
                mixer = new THREE.AnimationMixer(avatar);
                clock = new THREE.Clock();

                const rxMouthish = /(MOUTH|JAW|LIP|TONGUE|NOSE|BOCA|DIENTE|LABIO|morphTargetInfluences)/i;
                const rxTeethAny = /(Teeth|Dientes|Tooth)/i;
                let mouthTracks = [], bodyTracks = [], maxDuration = 0;
                for (const clip of gltf.animations) {
                    maxDuration = Math.max(maxDuration, clip.duration);
                    for (const tr of clip.tracks) {
                        const isMouth = rxMouthish.test(tr.name);
                        const isTeeth = rxTeethAny.test(tr.name);
                        if (isMouth) { if (!isTeeth) mouthTracks.push(tr); } else bodyTracks.push(tr);
                    }
                }
                if (bodyTracks.length) { const clipBody = new THREE.AnimationClip('BodyOnly', maxDuration || 1, bodyTracks); actionBody = mixer.clipAction(clipBody); actionBody.play(); }
                const talkByName = gltf.animations.find(c => TALK_NAME_HINTS.some(h => c.name?.toLowerCase().includes(h)));
                let talkClip = talkByName || (mouthTracks.length ? new THREE.AnimationClip('TalkSynth', maxDuration || 1, mouthTracks) : null);
                if (talkClip) { actionTalk = mixer.clipAction(talkClip); actionTalk.setLoop(THREE.LoopRepeat, Infinity); actionTalk.clampWhenFinished = false; actionTalk.enabled = true; actionTalk.play(); actionTalk.setEffectiveWeight(0.0); }

            return result;
        }

        const smoothstep = (a, b, x) => { const tt = Math.min(1, Math.max(0, (x - a) / (b - a))); return tt * tt * (3 - 2 * tt); };

        function resetMouthPose() {
            if (CTRL_MOUTH) restore(CTRL_MOUTH);
            if (CTRL_JAW) restore(CTRL_JAW);
            if (DEF_JAW) restore(DEF_JAW);
            if (TEETH_LOWER) restore(TEETH_LOWER);
            if (TEETH_UPPER) restore(TEETH_UPPER);
            (LIP_UP || []).forEach(n => restore(n));
            (LIP_DOWN || []).forEach(n => restore(n));
            (TONGUE || []).forEach(n => restore(n));
            if (mouthOpenMorph) { const { mesh, index } = mouthOpenMorph; mesh.morphTargetInfluences[index] = 0; mesh.needsUpdate = true; }
        }

        function frameToView(object, { fitPadding = (/Mobi|Android/i.test(navigator.userAgent) ? 1.24 : 1.30), extraBack = 1.45, targetYOffsetRatio = 0.18, faceFront = true, targetXOffsetRatio = 0.00 } = {}) {
            let sphere = object.userData.baseSphere;
            if (!sphere || !isFinite(sphere.radius) || sphere.radius === 0) { const b = computeRobustBounds(object); if (!b) return; sphere = b.sphere; object.userData.baseSphere = sphere; }
            const center = sphere.center.clone(), sizeY = Math.max(0.001, sphere.radius * 2);
            const fovRad = THREE.MathUtils.degToRad(camera.fov * 0.5);
            const dist = ((sphere.radius * fitPadding) / Math.sin(fovRad)) * extraBack;

            const target = center.clone(); target.y += sizeY * targetYOffsetRatio;
            const xOff = ALWAYS_CENTER_INIT ? 0.0 : targetXOffsetRatio; target.x += (sphere.radius * 2) * xOff;

            const dir = faceFront ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3().subVectors(camera.position, target).normalize();
            dir.multiplyScalar(dist); camera.position.copy(target).add(dir);

            camera.near = Math.max(0.01, (sphere.radius) / 200); camera.far = Math.max(1000, sphere.radius * 40); camera.updateProjectionMatrix();
            controls.target.copy(target); controls.update(); controls.minDistance = dist * 0.75; controls.maxDistance = dist * 2.2;
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = performance.now() * 0.001;
            if (mixer && clock) mixer.update(clock.getDelta());

            const talkingNow = forceTalking || agentTalking;
            const talkingFromMic = agentTalking && !forceTalking;

            const Lraw = levelOut; let targetOpen = 0;
            if (talkingNow) {
                const lvl = Math.max(0, Lraw - OUT_GATE);
                const g = talkingFromMic ? (micCalibrated ? micGain : 1) : 1;
                const boosted = Math.pow(lvl * g * OUT_GAIN, OUT_GAMMA);
                targetOpen = Math.min(boosted, 1.0);
                if (forceTalking && targetOpen < 0.25) targetOpen = 0.25;
            }
            const k = (targetOpen > jawOpen) ? ATTACK : (talkingNow ? RELEASE : RELEASE_SILENT);
            jawOpen += (targetOpen - jawOpen) * k;

            const clipAvailable = !!actionTalk;
            const useClip = (TALK_SOURCE === 'clip') || (TALK_SOURCE === 'auto' && clipAvailable);

            if (useClip) {
                if (actionTalk) {
                    const tgtW = talkingNow ? 1.0 : 0.0; const cur = actionTalk.getEffectiveWeight();
                    actionTalk.setEffectiveWeight(cur + (tgtW - cur) * 0.25);
                    actionTalk.timeScale = THREE.MathUtils.lerp(0.8, 1.6, clamp01(jawOpen));
                }
                if (actionMouth) actionMouth.setEffectiveWeight(0.0);
                if (mouthOpenMorph) { const { mesh, index } = mouthOpenMorph; mesh.morphTargetInfluences[index] = clamp01(jawOpen); mesh.needsUpdate = true; }
            } else {
                const mixerWeight = USE_MIXER_MOUTH ? (talkingNow ? MOUTH_MIXER_WHEN_TALK : MOUTH_MIXER_WHEN_SILENT) : 0.0;
                const manualWeight = talkingNow ? MOUTH_MANUAL_WHEN_TALK : MOUTH_MANUAL_WHEN_SILENT;
                if (actionMouth) { const cur = actionMouth.getEffectiveWeight(); actionMouth.setEffectiveWeight(cur + (mixerWeight - cur) * 0.2); }
                if (mixerWeight > 0) applyMixerAdditives(clamp01(jawOpen));
                if (jawOpen >= 0.02) { applyMouth(clamp01(jawOpen * manualWeight)); } else if (!talkingNow && mixerWeight === 0) { jawOpen = 0; resetMouthPose(); }
                const sealK = 1.0 - smoothstep(1.08, 0.18, jawOpen); applySeal(Math.min(1, Math.max(0, sealK)));
                if (mouthOpenMorph) { const { mesh, index } = mouthOpenMorph; mesh.morphTargetInfluences[index] = clamp01(jawOpen * manualWeight); mesh.needsUpdate = true; }
            }

            if (!useClip) applyTongue(t, clamp01(jawOpen));
            applyEyesIdle(); applyHeadAndBodyIdle(t);

            openTxt.textContent = jawOpen.toFixed(2);
            lvlTxt.textContent = levelOut.toFixed(2);
            lvlBar.style.width = Math.min(100, levelOut * 100) + '%';
            talkDot.classList.toggle('on', talkingNow);

            controls.update();
            renderer.render(scene, camera);
        }
        requestAnimationFrame(animate);

        // ---------- INIT ----------
        async function listMicsInit() { try { await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { } }
        listMicsInit().finally(listMics);
        fitCanvas43();

    </script>
