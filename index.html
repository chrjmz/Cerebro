<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>KRANG — clip lipsync + caja + puerta + dientes + lengua</title>
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

  <!-- CSS externo -->
  <link rel="stylesheet" href="./app.css" />

  <!-- Import maps y shims (se quedan en el HTML) -->
  <script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "livekit-client": "https://esm.sh/livekit-client@2",
      "tslib": "https://esm.sh/tslib@2",
      "@elevenlabs/client": "https://cdn.jsdelivr.net/npm/@elevenlabs/client@0.6.2/dist/lib.module.js",
      "meshopt-decoder": "https://cdn.jsdelivr.net/npm/meshoptimizer@0.20.0/meshopt_decoder.module.js"
    }
  }
  </script>
</head>

<body>
  <header>
    <button id="btnConnect">Connect mic</button>
    <button id="btnDisconnect" class="secondary" style="display:none">Disconnect</button>

    <span style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:12px; opacity:.9;">Mic:</span>
      <select id="micSelect" title="Select microphone"></select>
    </span>

    <!-- Modo fijo: clip (oculto de momento) -->
    <button id="btnMode" class="secondary" disabled title="Modo fijo" style="display: none;">Mode: clip</button>

    <details class="ctrl" id="panelJaw" style="display: none;">
      <summary>⚙️ Mandíbula/Teeth</summary>
      <div class="grid" style="margin-top:6px;">
        <label>Max mouth deg</label>
        <input id="sMaxDeg" type="range" min="8" max="40" step="1" value="22"><input id="nMaxDeg" type="number" step="1" value="22">

        <label>Lower lip drop (LIP_DOWN_DROP)</label>
        <input id="sLipDownDrop" type="range" min="0" max="2" step="0.01" value="1.15"><input id="nLipDownDrop" type="number" step="0.01" value="1.15">

        <label>Jaw center bias X / rad</label>
        <input id="sJawBias" type="range" min="-0.6" max="0.6" step="0.01" value="-0.15"><input id="nJawBias" type="number" step="0.01" value="-0.15">

        <label>Hard lock XZ (jaw)</label>
        <div class="split"><input id="chkLockXZ" type="checkbox" checked><span style="font-size:11px;opacity:.9">on</span></div>
        <div></div>

        <label>Teeth lower down Y (m)</label>
        <input id="sTLdownY" type="range" min="-0.01" max="0.02" step="0.0005" value="0.004"><input id="nTLdownY" type="number" step="0.0005" value="0.004">

        <label>Teeth lower back Z (m)</label>
        <input id="sTLbackZ" type="range" min="0" max="0.05" step="0.0005" value="0.020"><input id="nTLbackZ" type="number" step="0.0005" value="0.020">

        <label>Teeth lower rot (deg)</label>
        <input id="sTLrot" type="range" min="-10" max="15" step="0.1" value="3.5"><input id="nTLrot" type="number" step="0.1" value="3.5">

        <label>Teeth upper up Y (m)</label>
        <input id="sTUupY" type="range" min="-0.005" max="0.01" step="0.0005" value="0.0015"><input id="nTUupY" type="number" step="0.0005" value="0.0015">

        <label>Teeth upper rot (deg)</label>
        <input id="sTUrot" type="range" min="-5" max="8" step="0.1" value="1.2"><input id="nTUrot" type="number" step="0.1" value="1.2">
      </div>
    </details>

    <span id="status">disconnected</span>
  </header>

  <canvas id="stage"></canvas>

  <div id="loader" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div class="loader-text">Loading 3D avatar…</div>
  </div>

  <div class="hud" id="hud" aria-hidden="true" style="display: none !important;">
    <div>levelOut: <span id="lvlTxt">0.00</span></div>
    <div class="bar"><div id="lvlBar" class="fill"></div></div>
    <div class="row">
      <div>talking:</div><div id="talkDot" class="dot"></div>
      <div style="margin-left:10px">open:</div><div id="openTxt">0.00</div>
    </div>
  </div>

  <!-- JS externo (módulo) -->
  <script type="module" src="./app.js"></script>
</body>
</html>
