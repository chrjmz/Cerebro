<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>KRANG — Lipsync + dientes + lengua (full window + sombras realistas)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin:0;
      height:100dvh;
      background:#000;
      color:#eaeef5; font-family:system-ui, Segoe UI, Roboto, sans-serif;
      overflow:hidden;
    }
    header {
      position: fixed; top: 10px; left: 20px;
      padding:10px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      background: color-mix(in srgb, #0b0f1a 60%, transparent);
      border:1px solid #1f2840; border-radius:12px; box-shadow: 0 6px 24px rgba(0,0,0,.35); backdrop-filter: blur(6px);
      z-index: 20;
    }
    button { padding:8px 12px; border-radius:10px; border:0; background:#2a60ff; color:#fff; cursor:pointer; font-size:12px; }
    button.secondary { background:#27314e; }
    button[disabled] { opacity:.5; cursor:not-allowed; }
    #status { margin-left:auto; opacity:.9; font-size:12px; }

    #stage {
      position: fixed; inset:0; display:block; touch-action:none; background:transparent;
      width:100vw; height:100dvh;
    }

    #loader { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:radial-gradient(1200px 600px at 50% -10%, #101a33 0%, rgba(11,15,26,0.9) 40%, #0b0f1a 70%);
      z-index:10; flex-direction:column; gap:12px; }
    .spinner { width:48px; height:48px; border-radius:50%; border:4px solid #2a60ff30; border-top-color:#2a60ff; animation:spin 1s linear infinite; }
    @keyframes spin { to{ transform:rotate(360deg);} }
    .loader-text { font-size:14px; color:#cfe0ff; opacity:.9 }

    .hud { display:none; position:fixed; left:10px; bottom:10px; background:#0b0f1acc; border:1px solid #1f2840; border-radius:8px; padding:8px 10px; font:12px/1.2 system-ui; z-index:30; }
    .bar { width:160px; height:6px; background:#18203a; border-radius:4px; overflow:hidden; }
    .fill { height:100%; width:0%; background:#2a60ff; }
    .row { display:flex; gap:8px; align-items:center; margin-top:6px; }
    .dot { width:8px; height:8px; border-radius:50%; background:#ff5566; }
    .dot.on { background:#5aff7a; }

    @media (max-width: 640px) { header { left: 8px; right: 8px; top:8px; justify-content:space-between } }

    body{
      background-image: url("./img/fondo.png");
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
    }
    canvas { pointer-events: none; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "livekit-client": "https://esm.sh/livekit-client@2",
      "tslib": "https://esm.sh/tslib@2",
      "@elevenlabs/client": "https://cdn.jsdelivr.net/npm/@elevenlabs/client@0.6.2/dist/lib.module.js",
      "meshopt-decoder": "https://cdn.jsdelivr.net/npm/meshoptimizer@0.20.0/meshopt_decoder.module.js"
    }
  }
  </script>
</head>
<body>
  <header>
    <button id="btnConnect">Connect mic</button>
    <button id="btnDisconnect" class="secondary" style="display:none">Disconnect</button>
    <span style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:12px; opacity:.9;">Mic:</span>
      <select id="micSelect" title="Select microphone"></select>
    </span>
    <span id="status">disconnected</span>
    <button id="btnTestTalk" class="secondary">Test lipsync</button>
  </header>

  <canvas id="stage"></canvas>

  <div id="loader" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div class="loader-text">Loading 3D avatar…</div>
  </div>

  <div class="hud" id="hud" aria-hidden="true" style="display: none !important;">
    <div>levelOut: <span id="lvlTxt">0.00</span></div>
    <div class="bar"><div id="lvlBar" class="fill"></div></div>
    <div class="row">
      <div>talking:</div><div id="talkDot" class="dot"></div>
      <div style="margin-left:10px">open:</div><div id="openTxt">0.00</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader }  from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';
    import { KTX2Loader }  from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/KTX2Loader.js';
    import { MeshoptDecoder } from 'meshopt-decoder';
    import { Conversation } from '@elevenlabs/client';

    // ---------- CONFIG ----------
    const AGENT_ID = 'agent_5501k5ckwydxem1s0sdzjj17ej9m';
    const WP_BASE  = 'https://test-ai.garabatoweb.com';
    const GLB_URL  = './22222.glb';
    const FETCH_WEBRTC_TOKEN_URL = `${WP_BASE}/wp-json/eleven/v1/webrtc-token?agent_id=${encodeURIComponent(AGENT_ID)}`;

    const USE_MIXER_MOUTH = true;

    const MOUTH_MIXER_WHEN_TALK   = 0.55;
    const MOUTH_MIXER_WHEN_SILENT = 0.0;
    const MOUTH_MANUAL_WHEN_TALK   = 0.55;
    const MOUTH_MANUAL_WHEN_SILENT = 0.0;

    const ALWAYS_CENTER_INIT = true;

    const VIEW = {
      faceFront:true,
      targetYOffsetRatio:0.65,
      fitPadding:0.75,
      extraBack:0.41,
      targetXOffsetRatio: 0.00
    };

    const FOV = 40;
    const FIGURE_TILT_DEG = { x: -20, y: 0, z: 0 };

    // ---------- ESCENA ----------
    const canvas   = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });

    renderer.setPixelRatio(Math.min(devicePixelRatio, /Mobi|Android/i.test(navigator.userAgent) ? 1.5 : 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 2.85;

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(/Mobi|Android/i.test(navigator.userAgent) ? 40 : FOV, 1, 0.01, 100);
    camera.position.set(3,1.6,4);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.enableZoom = false;

    const pivot = new THREE.Group();
    scene.add(pivot);

    canvas.addEventListener('wheel', e => e.preventDefault(), { passive:false });
    window.addEventListener('gesturestart', e => e.preventDefault(), { passive:false });
    window.addEventListener('gesturechange', e => e.preventDefault(), { passive:false });
    window.addEventListener('gestureend', e => e.preventDefault(), { passive:false });

    let avatar = null;

    // === viewport seguro ===
    function getViewportSize(){
      const vv = window.visualViewport;
      if (vv) return { w: Math.round(vv.width), h: Math.round(vv.height) };
      return { w: window.innerWidth, h: window.innerHeight };
    }

    function onResize(){
      const { w, h } = getViewportSize();
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.fov = /Mobi|Android/i.test(navigator.userAgent) ? 40 : FOV;
      camera.updateProjectionMatrix();
      if (avatar) frameToView(avatar, VIEW);
    }
    addEventListener('resize', onResize, { passive:true });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize, { passive:true });

    // ---------- HELPERS ----------
    const clamp01 = (x)=> Math.min(1, Math.max(0, x));
    function disableFrustumCulling(root){ root.traverse(o=>{ if(o.isMesh) o.frustumCulled=false; }); }
    const findExact = (root, name)=>{ let f=null; root.traverse(o=>{ if(!f && o.name===name) f=o; }); return f; };
    const findFirst = (root, names)=>{ for(const n of names){ const o=findExact(root,n); if(o) return o; } return null; };
    const findRegex = (root, regex)=>{ let found=[]; root.traverse(o=>{ if(regex.test(o.name)) found.push(o); }); return found; };

    const restQ = new Map(), restP = new Map();
    const saveRest = o=>{ if(!o) return; if(!restQ.has(o)) restQ.set(o, o.quaternion.clone()); if(!restP.has(o)) restP.set(o, o.position.clone()); };
    const restore  = o=>{ if(!o) return; const q=restQ.get(o), p=restP.get(o); if(q) o.quaternion.copy(q); if(p) o.position.copy(p); };
    const rot = (n, ax, r)=>{ if(!n) return; restore(n); const q=new THREE.Quaternion().setFromAxisAngle(ax, r); n.quaternion.multiply(q).normalize(); };
    const mov = (n, dx=0,dy=0,dz=0)=>{ if(!n) return; restore(n); n.position.x+=dx; n.position.y+=dy; n.position.z+=dz; };

    const addRot = (n, ax, r)=>{ if(!n || r===0) return; const q=new THREE.Quaternion().setFromAxisAngle(ax, r); n.quaternion.multiply(q).normalize(); };
    const addMov = (n, dx=0,dy=0,dz=0)=>{ if(!n) return; n.position.x+=dx; n.position.y+=dy; n.position.z+=dz; };

    function resetMouthPose(){
      if(CTRL_MOUTH) restore(CTRL_MOUTH);
      if(CTRL_JAW)   restore(CTRL_JAW);
      if(DEF_JAW)    restore(DEF_JAW);
      if(TEETH_LOWER) restore(TEETH_LOWER);
      if(TEETH_UPPER) restore(TEETH_UPPER);
      (LIP_UP||[]).forEach(n => restore(n));
      (LIP_DOWN||[]).forEach(n => restore(n));
      (TONGUE||[]).forEach(n => restore(n));
    }

    function copyPose(from, to){ if(!from || !to) return; to.position.copy(from.position); to.quaternion.copy(from.quaternion); }

    // ---------- RIG ----------
    let ROOT=null, DEF_HEAD=null, CTRL_HEAD_UP=null;
    let CTRL_MOUTH=null, CTRL_JAW=null, DEF_JAW=null;
    let TEETH_LOWER=null, TEETH_UPPER=null;
    let LIP_UP=[], LIP_DOWN=[];
    let LIP_UP_CORNERS=[], LIP_UP_CENTER=[];
    let LIP_DOWN_CORNERS=[], LIP_DOWN_CENTER=[];
    let OJO_L=null, OJO_R=null;
    let FK_LEFT=[], FK_RIGHT=[];
    let ARM_L=[], ARM_R=[];
    let TONGUE=[];

    // ---------- UI ----------
    const statusEl=document.getElementById('status');
    const btnConnect=document.getElementById('btnConnect');
    const btnDisconnect=document.getElementById('btnDisconnect');
    const micSelect=document.getElementById('micSelect');
    const btnTestTalk=document.getElementById('btnTestTalk');
    const statusElSet = (t)=> statusEl.textContent = t;

    const lvlTxt = document.getElementById('lvlTxt');
    const lvlBar = document.getElementById('lvlBar');
    const talkDot = document.getElementById('talkDot');
    const openTxt = document.getElementById('openTxt');

    // ---------- CARGA (GLB) ----------
    const loader = new GLTFLoader();
    const draco = new DRACOLoader(); draco.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/'); loader.setDRACOLoader(draco);
    const ktx2 = new KTX2Loader().setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/'); ktx2.detectSupport(renderer); loader.setKTX2Loader(ktx2);
    loader.setMeshoptDecoder(MeshoptDecoder);

    let mixer=null, clock=null, actionBody=null, actionMouth=null;

    function computeBaseSphere(object){
      const box = new THREE.Box3().setFromObject(object);
      const sphere = box.getBoundingSphere(new THREE.Sphere());
      return sphere;
    }

    function normalizeAndCenter(object){
      const box = new THREE.Box3().setFromObject(object);
      const size=box.getSize(new THREE.Vector3());
      const center=box.getCenter(new THREE.Vector3());
      const maxSide = Math.max(size.x, size.y, size.z);
      if (!isFinite(maxSide) || maxSide===0) return;
      object.position.x -= center.x;
      object.position.z -= center.z;
      const target = 2.5;
      if (maxSide < 0.05 || maxSide > 50) {
        const s = target / maxSide;
        object.scale.multiplyScalar(s);
      }
    }

    function addCinematicLights(target) {
      const amb = new THREE.AmbientLight(0xffffff, 0.30); scene.add(amb);

      const key = new THREE.DirectionalLight(0xfff2e0, 1.45);
      key.position.set(-0.0, 0.8, 1);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.radius = 4;
      key.shadow.bias = -0.00018;

      const box = new THREE.Box3().setFromObject(target || pivot);
      const s = box.getSize(new THREE.Vector3()).length() * 0.6 || 3;
      key.shadow.camera.near = 0;
      key.shadow.camera.far  = 10;
      key.shadow.camera.left = -s; key.shadow.camera.right = s;
      key.shadow.camera.top  =  s; key.shadow.camera.bottom = -s;
      scene.add(key);

      const fill = new THREE.DirectionalLight(0xaec8ff, 0.55);
      fill.position.set(-1.1, 1.2, 0.8);
      scene.add(fill);

      const rim = new THREE.DirectionalLight(0xfff2d0, 0.50);
      rim.position.set(0.5, 0.9, -1.2);
      scene.add(rim);
    }

    function buildShadowReceiversAround(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      const shadowMatFloor = new THREE.ShadowMaterial({ opacity: 0.35 }); shadowMatFloor.depthWrite = false;
      const shadowMatWall  = new THREE.ShadowMaterial({ opacity: 0.18 }); shadowMatWall.depthWrite = false;

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(size.x * 2.2, size.z * 2.2), shadowMatFloor);
      floor.rotation.x = -Math.PI * 0.5;
      floor.position.set(center.x, box.min.y + 0.02, center.z + size.z*0.15);
      floor.receiveShadow = true; floor.renderOrder = -1; scene.add(floor);

      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(size.x * 2.0, size.y * 2.0), shadowMatWall);
      backWall.position.set(center.x, center.y, box.max.z + size.z*0.25);
      backWall.receiveShadow = true; scene.add(backWall);

      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(size.z * 2.0, size.y * 2.0), shadowMatWall);
      leftWall.rotation.y = Math.PI * 0.5;
      leftWall.position.set(box.min.x - size.x*0.35, center.y, center.z + size.z*0.05);
      leftWall.receiveShadow = true; scene.add(leftWall);

      const rightWall = leftWall.clone();
      rightWall.position.x = box.max.x + size.x*0.35;
      scene.add(rightWall);
    }

    console.log('[GLB] Cargando:', GLB_URL);
    loader.load(GLB_URL, (gltf)=>{
      avatar = gltf.scene;
      if (!avatar) { throw new Error('GLB sin escena'); }

      normalizeAndCenter(avatar);
      disableFrustumCulling(avatar);
      pivot.add(avatar);

      avatar.traverse(o=>{ if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      avatar.traverse(o=>{
        if (o.isMesh && o.material && 'roughness' in o.material) {
          o.material.roughness = Math.min(0.55, o.material.roughness ?? 0.6);
          o.material.metalness = Math.max(0.05, o.material.metalness ?? 0.0);
          o.material.needsUpdate = true;
        }
      });

      // === NODOS ===
      ROOT         = findFirst(avatar, ['ROOT']) || findRegex(avatar, /ROOT|Armature|Hip/i)[0];
      DEF_HEAD     = findFirst(avatar, ['DEF_HEAD']) || findRegex(avatar, /DEF[_-]?HEAD|Cabeza|Head/i)[0];
      CTRL_HEAD_UP = findFirst(avatar, ['CTRL_HEAD_UP']) || findRegex(avatar, /CTRL[_-]?HEAD/i)[0];

      CTRL_MOUTH   = findFirst(avatar, ['CTRL_MOUTH','ROT_MOUTH']) || findRegex(avatar, /MOUTH|BOCA/i)[0];
      CTRL_JAW     = findFirst(avatar, ['CTRL_JAW']) || findRegex(avatar, /JAW|MANDIB/i)[0];
      DEF_JAW      = findFirst(avatar, ['DEF_JAW']) || findRegex(avatar, /DEF[_-]?JAW/i)[0];

      TEETH_LOWER  = findFirst(avatar, ['CTRL_TEETH_DOWN','DEF_TEETH_DOWN','Dientes']) || findRegex(avatar, /(Teeth|Dientes).*(Down|Inferior)?/i)[0];
      TEETH_UPPER  = findFirst(avatar, ['CTRL_TEETH_UP','DEF_TEETH_UP']) || findRegex(avatar, /(Teeth|Dientes).*(Up|Superior)/i)?.[0] || null;

      const lipsUp  = findRegex(avatar, /(DEF_)?LIP.*UP|DEF_LIP_UP|LIP_UP|UP_CENTER/i);
      const lipsDn  = findRegex(avatar, /(DEF_)?LIP.*DOWN|DEF_LIP_DOWN|LIP_DOWN|DOWN_CENTER/i);
      const lipCorners = findRegex(avatar, /(DEF_)?LIP.*CORNER|LIP_CORNER/i);
      const preferDEF = (arr)=>{ const def=arr.filter(n=>/(^|_)DEF_/.test(n.name)); return def.length? def : arr; };
      LIP_UP   = preferDEF([...lipsUp, ...lipCorners].filter(Boolean));
      LIP_DOWN = preferDEF([...lipsDn, ...lipCorners].filter(Boolean));

      // separar centro vs comisuras
      const isCorner = (n)=> /CORNER/i.test(n.name);
      LIP_DOWN_CORNERS = LIP_DOWN.filter(isCorner);
      LIP_DOWN_CENTER  = LIP_DOWN.filter(n => !isCorner(n));
      LIP_UP_CORNERS   = LIP_UP.filter(isCorner);
      LIP_UP_CENTER    = LIP_UP.filter(n => !isCorner(n));

      OJO_L = findFirst(avatar, ['CTRL_EYE.L','Ojo_Izquierdo']) || findRegex(avatar, /(EYE|Ojo).*L/i)[0];
      OJO_R = findFirst(avatar, ['CTRL_EYE.R','Ojo_derecho'])  || findRegex(avatar, /(EYE|Ojo).*R/i)[0];

      const fkLeftNames  = ['CTRL_FK_TENTACULO_B_02.L','CTRL_FK_TENTACULO_B_03.L','CTRL_FK_TENTACULO_B_04.L','CTRL_FK_TENTACULO_B_05.L','CTRL_FK_TENTACULO_B_06.L','CTRL_FK_TENTACULO_B_07.L'];
      const fkRightNames = ['CTRL_FK_TENTACULO_B_02.R','CTRL_FK_TENTACULO_B_03.R','CTRL_FK_TENTACULO_B_04.R','CTRL_FK_TENTACULO_B_05.R','CTRL_FK_TENTACULO_B_06.R','CTRL_FK_TENTACULO_B_07.R'];
      FK_LEFT  = fkLeftNames .map(n=>findExact(avatar,n)).filter(Boolean);
      FK_RIGHT = fkRightNames.map(n=>findExact(avatar,n)).filter(Boolean);
      if (FK_LEFT.length === 0)  FK_LEFT  = findRegex(avatar, /(TENT|Tentaculo|Tentacle).*(\.L|_L| L)$/i);
      if (FK_RIGHT.length === 0) FK_RIGHT = findRegex(avatar, /(TENT|Tentaculo|Tentacle).*(\.R|_R| R)$/i);

      const armLeftNames  = ['CTRL_ARM_UP.L', 'CTRL_ARM_LOWER.L', 'CTRL_HAND.L'];
      const armRightNames = ['CTRL_ARM_UP.R', 'CTRL_ARM_LOWER.R', 'CTRL_HAND.R'];
      ARM_L = armLeftNames .map(n => findExact(avatar, n)).filter(Boolean);
      ARM_R = armRightNames.map(n => findExact(avatar, n)).filter(Boolean);
      if (ARM_L.length === 0) ARM_L = findRegex(avatar, /(ARM|Hombro|Brazo).*L/i);
      if (ARM_R.length === 0) ARM_R = findRegex(avatar, /(ARM|Hombro|Brazo).*R/i);

      const tongueCtrls = ['CTRL_TONGUE_01','CTRL_TONGUE_02','CTRL_TONGUE_03','CTRL_TONGUE_04','CTRL_MASTER_TONGUE'];
      TONGUE = tongueCtrls.map(n=>findExact(avatar,n)).filter(Boolean);
      if (TONGUE.length===0) TONGUE = findRegex(avatar, /(CTRL|DEF)[_\-]?TONGUE(_\d+)?|Lengua|Tongue/i);

      ;[ROOT,DEF_HEAD,CTRL_HEAD_UP,CTRL_MOUTH,CTRL_JAW,DEF_JAW,TEETH_LOWER,TEETH_UPPER,OJO_L,OJO_R,
        ...LIP_UP,...LIP_DOWN,...FK_LEFT,...FK_RIGHT, ...ARM_L, ...ARM_R, ...TONGUE].forEach(saveRest);

      avatar.userData.baseSphere = computeBaseSphere(avatar);

      onResize();
      frameToView(avatar, VIEW);
      addCinematicLights(avatar);
      buildShadowReceiversAround(avatar);

      const tmpBox = new THREE.Box3().setFromObject(avatar);
      controls.target.y -= 0.08 * tmpBox.getSize(new THREE.Vector3()).y;
      camera.position.y -= 0.05;
      controls.update();

      document.getElementById('loader').style.display='none';
      document.getElementById('hud').style.display='none';

      if (gltf.animations && gltf.animations.length) {
        mixer = new THREE.AnimationMixer(avatar);
        clock = new THREE.Clock();

        const rxMouthish = /(MOUTH|JAW|LIP|TONGUE|NOSE|BOCA|DIENTE|LABIO|Cabeza\.morphTargetInfluences|Head\.morphTargetInfluences)/i;
        const rxTeethAny = /(Teeth|Dientes)/i;

        let mouthTracks = [], bodyTracks = [], maxDuration = 0;
        for (const clip of gltf.animations) {
          maxDuration = Math.max(maxDuration, clip.duration);
          for (const tr of clip.tracks) {
            const isMouth = rxMouthish.test(tr.name);
            const isTeeth = rxTeethAny.test(tr.name);
            if (isMouth) {
              // Nota: dejamos dientes FUERA del mixer de boca; los driveremos manualmente con la mandíbula
              if (!isTeeth) mouthTracks.push(tr);
            } else {
              bodyTracks.push(tr);
            }
          }
        }

        const clipBody  = new THREE.AnimationClip('BodyOnly',  maxDuration || 1, bodyTracks);
        const clipMouth = new THREE.AnimationClip('MouthOnlyNoTeeth', maxDuration || 1, mouthTracks);
        actionBody  = mixer.clipAction(clipBody);  actionBody.play();
        actionMouth = mixer.clipAction(clipMouth); actionMouth.play();
        actionMouth.enabled = true;
        actionMouth.setEffectiveWeight(0.0);
      }

      pivot.rotation.set(
        THREE.MathUtils.degToRad(FIGURE_TILT_DEG.x),
        THREE.MathUtils.degToRad(FIGURE_TILT_DEG.y),
        THREE.MathUtils.degToRad(FIGURE_TILT_DEG.z)
      );

    }, (ev)=>{}, (err)=>{
      console.error('GLB load error:', err);
      document.getElementById('loader').querySelector('.loader-text').textContent = 'Error loading 3D avatar';
      alert('No se pudo cargar el GLB. Revisa la consola (F12) para detalles.');
    });

    // ---------- ENCUADRE ----------
    function frameToView(object, {
      fitPadding=(/Mobi|Android/i.test(navigator.userAgent)?1.24:1.30),
      extraBack=1.45,
      targetYOffsetRatio=0.18,
      faceFront=true,
      targetXOffsetRatio=0.00
    } = {}){
      const sphere = object.userData.baseSphere || new THREE.Box3().setFromObject(object).getBoundingSphere(new THREE.Sphere());
      if (!sphere || !isFinite(sphere.radius)) return;

      const center = sphere.center.clone();
      const sizeY  = sphere.radius * 2;
      const fovRad = THREE.MathUtils.degToRad(camera.fov * 0.5);
      const dist   = ((sphere.radius * fitPadding) / Math.sin(fovRad)) * extraBack;

      const target = center.clone();
      target.y += sizeY * targetYOffsetRatio;

      const xOff = ALWAYS_CENTER_INIT ? 0.00 : targetXOffsetRatio;
      target.x += (sphere.radius * 2) * xOff;

      const dir = faceFront ? new THREE.Vector3(0,0,1) : new THREE.Vector3().subVectors(camera.position, target).normalize();
      dir.multiplyScalar(dist);
      camera.position.copy(target).add(dir);

      camera.near = Math.max(0.01, (sphere.radius) / 200);
      camera.far  = Math.max(100, sphere.radius * 40);
      camera.updateProjectionMatrix();

      controls.target.copy(target);
      controls.update();
      controls.minDistance = dist*0.75;
      controls.maxDistance = dist*2.2;
    }

    // ---------- AUDIO / SESIÓN ----------
    let conversation=null, volPoller=null, levelOut=0;
    let isConnecting = false;

    // normalización de mic
    let micGain = 1;
    let micCalibrated = false;
    async function calibrateMicGain(ms = 700) {
      const t0 = performance.now();
      let sum = 0, n = 0;
      while (performance.now() - t0 < ms) {
        sum += levelOut; n++;
        await new Promise(r => setTimeout(r, 16));
      }
      const avg = (n ? sum/n : 0.05);
      const target = 0.12;
      micGain = (avg > 1e-3) ? (target / avg) : 1;
      micCalibrated = true;
    }

    async function listMics(){
      try{ await navigator.mediaDevices.getUserMedia({audio:true}); }catch{}
      const devices=await navigator.mediaDevices.enumerateDevices();
      const mics=devices.filter(d=>d.kind==='audioinput'); micSelect.innerHTML='';
      for(const it of mics){
        const opt=document.createElement('option'); opt.value=it.deviceId; opt.textContent=it.label||`Mic (${it.deviceId.slice(0,6)}…)`;
        micSelect.appendChild(opt);
      }
    }
    listMics(); navigator.mediaDevices.addEventListener?.('devicechange', listMics);

    async function getWebRTCToken(){
      const r=await fetch(FETCH_WEBRTC_TOKEN_URL,{credentials:'omit'});
      if(!r.ok) throw new Error('Could not obtain WebRTC token');
      const {token}=await r.json(); return token;
    }

    const OUT_GATE = 0.02;
    const OUT_GAIN = 4.2;
    const OUT_GAMMA = 0.75;

    const ATTACK=0.55, RELEASE=0.28, RELEASE_SILENT=0.80;
    const MAX_MOUTH_DEG=22;

    const THRESH_ON  = 0.06;
    const THRESH_OFF = 0.03;
    const HOLD_ON_MS  = 80;
    const HOLD_OFF_MS = 150;

    let agentTalking = false;
    let aboveSince = 0, belowSince = 0;

    function setUIConnected(state){
      if(state){
        btnConnect.style.display='none';
        btnDisconnect.style.display='';
        btnConnect.disabled = true;
        micSelect.disabled = true;
        statusElSet('connected');
      }else{
        btnConnect.style.display='';
        btnDisconnect.style.display='none';
        btnConnect.disabled = false;
        micSelect.disabled = false;
        statusElSet('disconnected');
      }
    }

    let forceTalking = false;
    btnTestTalk.onclick = () => {
      forceTalking = !forceTalking;
      btnTestTalk.textContent = forceTalking ? 'Stop test' : 'Test lipsync';
    };

    btnConnect.onclick=async ()=>{
      if (conversation || isConnecting) return;
      isConnecting = true;
      btnConnect.disabled = true;
      statusElSet('connecting…');
      try{
        const inputDeviceId=micSelect.value||undefined;
        const token=await getWebRTCToken();

        conversation=await Conversation.startSession({
          agentId:AGENT_ID, connectionType:'webrtc', inputDeviceId, webrtc:{token}
        });

        if (volPoller) { clearInterval(volPoller); volPoller=null; }
        volPoller=setInterval(async ()=>{
          try{
            const v=await conversation.getOutputVolume?.();
            if(typeof v==='number'){
              const ALPHA = 0.35;
              levelOut = (1-ALPHA)*levelOut + ALPHA*v;

              const now = performance.now();
              if(levelOut >= THRESH_ON){
                aboveSince = aboveSince || now; belowSince = 0;
                if(!agentTalking && (now - aboveSince) >= HOLD_ON_MS) agentTalking = true;
              } else if(levelOut <= THRESH_OFF){
                belowSince = belowSince || now; aboveSince = 0;
                if(agentTalking && (now - belowSince) >= HOLD_OFF_MS) agentTalking = false;
              }

              lvlTxt.textContent = levelOut.toFixed(2);
              lvlBar.style.width = Math.min(100, levelOut*100) + '%';
              talkDot.classList.toggle('on', agentTalking);
            }
          }catch{}
        },60);

        setUIConnected(true);
        calibrateMicGain(); // normalización mic
      }catch(e){
        console.error(e);
        statusElSet('failed');
        alert(e.message);
        setUIConnected(false);
        conversation=null;
      }finally{
        isConnecting = false;
      }
    };

    btnDisconnect.onclick=async ()=>{
      try{ if(conversation) await conversation.endSession(); }catch{}
      conversation=null;
      if (volPoller) { clearInterval(volPoller); volPoller=null; }
      levelOut = 0; agentTalking=false; aboveSince=0; belowSince=0;
      setUIConnected(false);
    };

    // ---------- ANIMACIÓN / CARA ----------
    function applyMixerAdditives(open){
      if (!open) return;
      const upDy = +0.08 * open;
      const upRx = THREE.MathUtils.degToRad(6) * open;
      (LIP_UP||[]).forEach(n=>{ addMov(n, 0, upDy, 0); addRot(n, new THREE.Vector3(1,0,0), upRx); });
    }

    let eyesCur=new THREE.Vector2(0,0), eyesTarget=new THREE.Vector2(0,0), nextSaccadeAt=0;
    let jawOpen=0;

    // --- LIP SEAL (sello de labios con pinch) ---
    const SEAL = {
      enabled: true,

      // Labio inferior
      lowerUpMid:  -2.8,          // centro sube más
      lowerUpCornerScale: 2.45,  // comisuras suben menos (evita ensanche)
      lowerRxDeg:  -25,           // rotación X hacia dentro
      cornerPinchX: -10,        // comisuras hacia dentro (X)
      cornerRotZDeg: -1,          // rotación Z en comisuras para plegar

      // Labio superior (suave)
      upperDown:  -1,
      upperRxDeg: -8,

      // Mandíbula
      jawRxDeg:   18
    };

    function applyMouth(open){
      const ang = THREE.MathUtils.degToRad(MAX_MOUTH_DEG) * open;

      if(CTRL_MOUTH) rot(CTRL_MOUTH, new THREE.Vector3(1,0,0), -ang);
      if(CTRL_JAW)   rot(CTRL_JAW,   new THREE.Vector3(1,0,0), -ang*0.85);
      if(DEF_JAW)    rot(DEF_JAW,    new THREE.Vector3(1,0,0), -ang*0.65);

      // DIENTES: seguir a la mandíbula (sin “congelar”)
      if(TEETH_LOWER){
        copyPose(DEF_JAW || CTRL_JAW || CTRL_MOUTH, TEETH_LOWER);
        addMov(TEETH_LOWER, 0, -0.00*open, -0.18);
        addRot(TEETH_LOWER, new THREE.Vector3(1,0,0), -ang*0.10);
      }
      if(TEETH_UPPER){
        restore(TEETH_UPPER); // normalmente fijo, con micro ajuste
        addMov(TEETH_UPPER, 0, +0.015*open, 0);
      }

      // labios por apertura base (animación)
      const upDy = -2.45*open, upRx = +ang*0.14;
      const dnDy = -1.85*open, dnRx = -ang*0.22;
      (LIP_UP||[]).forEach(n=>{ mov(n, 0, upDy, 0); rot(n, new THREE.Vector3(1,0,0),  upRx); });
      (LIP_DOWN||[]).forEach(n=>{ mov(n, 0, dnDy, 0); rot(n, new THREE.Vector3(1,0,0), dnRx); });
    }

    function applySeal(k){
      if(!SEAL.enabled || k<=0) return;

      const rxLower = THREE.MathUtils.degToRad(SEAL.lowerRxDeg) * k;
      const rxUpper = THREE.MathUtils.degToRad(SEAL.upperRxDeg) * k;
      const rxJaw   = THREE.MathUtils.degToRad(SEAL.jawRxDeg)   * k;
      const rzCorner= THREE.MathUtils.degToRad(SEAL.cornerRotZDeg) * k;

      // Inferior: CENTRO
      (LIP_DOWN_CENTER||[]).forEach(n=>{
        addMov(n, 0, +SEAL.lowerUpMid * k, 0);
        addRot(n, new THREE.Vector3(1,0,0), rxLower);
      });

      // Inferior: COMISURAS (menos “up”, con pinch y rotación Z)
      (LIP_DOWN_CORNERS||[]).forEach(n=>{
        addMov(n, 0, +(SEAL.lowerUpMid * SEAL.lowerUpCornerScale) * k, 0);
        const isLeft = /\.L\b|_L\b|\bL\b/i.test(n.name);
        const dir = isLeft ? +1 : -1; // si invierte, cambia signo
        addMov(n, SEAL.cornerPinchX * dir * k, 0, 0);
        addRot(n, new THREE.Vector3(0,0,1), rzCorner * -dir);
        addRot(n, new THREE.Vector3(1,0,0), rxLower * 0.7);
      });

      // Superior (suave)
      (LIP_UP_CENTER||[]).forEach(n=>{
        addMov(n, 0, -SEAL.upperDown * k, 0);
        addRot(n, new THREE.Vector3(1,0,0), rxUpper * 0.8);
      });
      (LIP_UP_CORNERS||[]).forEach(n=>{
        addMov(n, 0, -(SEAL.upperDown * 0.5) * k, 0);
        addRot(n, new THREE.Vector3(1,0,0), rxUpper * 0.6);
      });

      // Mandíbula: micro cierre (acompaña dientes inferiores)
      if(CTRL_JAW) addRot(CTRL_JAW, new THREE.Vector3(1,0,0), +rxJaw);
      if(DEF_JAW)  addRot(DEF_JAW,  new THREE.Vector3(1,0,0), +rxJaw*0.7);
      if(TEETH_LOWER) addRot(TEETH_LOWER, new THREE.Vector3(1,0,0), +rxJaw*0.25);
    }

    function applyTongue(t, open){
      if(!TONGUE || TONGUE.length===0 || open<=0) return;
      const baseCurl = THREE.MathUtils.degToRad(18) * open;
      const wagAmp   = THREE.MathUtils.degToRad(6)  * open;
      const wagSpd   = 3.2;
      TONGUE.forEach((n,i)=>{
        restore(n);
        const fall = 1 - i*0.18;
        const curl = baseCurl * fall;
        const wag  = Math.sin(t*wagSpd + i*0.7) * wagAmp * fall;
        const qx = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), -curl);
        const qy = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), wag);
        n.quaternion.multiply(qx).multiply(qy).normalize();
        addMov(n, 0, 0.02*open*fall, 0.01*open*fall);
      });
    }

    function applyArmsWhileTalking(t, energy){
      const baseAmp = 0.22 * energy;
      const speed   = 2.2;
      const drive = (arr, invert=false) => {
        (arr||[]).forEach((n,i)=>{
          if(!n) return;
          restore(n);
          const falloff = 0.85 - i * 0.18;
          const angZ = Math.sin(t * speed + i * 0.8) * baseAmp * falloff * (invert ? -1 : 1);
          const angY = Math.cos(t * speed * 0.9 + i * 0.7) * baseAmp * 0.6 * falloff;
          const qZ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), angZ);
          const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), angY);
          n.quaternion.multiply(qZ).multiply(qY).normalize();
        });
      };
      drive(ARM_L, false);
      drive(ARM_R, true);
    }

    function applyTentacles(t, talkEnergy=0){
      const idleAmp = 0.12, idleSpd = 1.6;
      const extraAmp = 0.35 * talkEnergy;
      const liftAmp  = 0.28 * talkEnergy;

      const driveChain=(arr, invert=false)=>{
        (arr||[]).forEach((n,i)=>{
          if(!n) return;
          restore(n);
          const fall = 0.85 - i*0.09;
          const amp  = (idleAmp + extraAmp*(1 - i*0.15)) * fall;
          const spd  = idleSpd;

          const angZ = Math.sin(t*spd + i*0.6) * amp * (invert?-1:1);
          const angY = Math.cos(t*spd*0.9 + i*0.5) * amp * 0.6;
          const lift = (i<2 ? liftAmp*(invert?-0.7:0.7) : 0.0);

          const qZ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), angZ);
          const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), angY);
          const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), lift);
          n.quaternion.multiply(qZ).multiply(qY).multiply(qX).normalize();
        });
      };

      driveChain(FK_LEFT,false);
      driveChain(FK_RIGHT,true);
    }

    function applyEyesIdle(){
      const now=performance.now();
      if(now>nextSaccadeAt){
        nextSaccadeAt = now + 600 + Math.random()*900;
        const amp = 0.18;
        eyesTarget.set((Math.random()*2-1)*amp,(Math.random()*2-1)*(amp*0.6));
      }
      eyesCur.lerp(eyesTarget,0.15);

      const qy = (x)=> new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), x);
      const qx = (y)=> new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), y);
      if(OJO_L){ restore(OJO_L); OJO_L.quaternion.multiply(qy(eyesCur.x)).multiply(qx(eyesCur.y)).normalize(); }
      if(OJO_R){ restore(OJO_R); OJO_R.quaternion.multiply(qy(eyesCur.x)).multiply(qx(eyesCur.y)).normalize(); }
    }

    function applyHeadAndBodyIdle(t){
      const nod = Math.sin(t*0.6)*0.02;
      if(DEF_HEAD){ restore(DEF_HEAD); rot(DEF_HEAD, new THREE.Vector3(1,0,0), nod); }
      else if(CTRL_HEAD_UP){ restore(CTRL_HEAD_UP); rot(CTRL_HEAD_UP, new THREE.Vector3(1,0,0), nod); }

      if(ROOT){
        restore(ROOT);
        const sway=Math.sin(t*0.9)*0.03;
        const twist=Math.sin(t*0.5)*0.015;
        const qZ=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),sway);
        const qY=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),twist);
        ROOT.quaternion.multiply(qZ).multiply(qY).normalize();
      }
    }

    function animate(){
      requestAnimationFrame(animate);
      const t = performance.now()*0.001;

      if (mixer && clock) mixer.update(clock.getDelta());

      const talkingNow = forceTalking || agentTalking;
      const talkingFromMic = agentTalking && !forceTalking;

      const Lraw = levelOut;
      let targetOpen = 0;
      if (talkingNow) {
        const lvl = Math.max(0, Lraw - OUT_GATE);
        const g = talkingFromMic ? (micCalibrated ? micGain : 1) : 1; // normalización mic
        const boosted = Math.pow(lvl * g * OUT_GAIN, OUT_GAMMA);
        targetOpen = Math.min(boosted, 1.0);
        if (forceTalking && targetOpen < 0.25) targetOpen = 0.25;
      }

      const k = (targetOpen > jawOpen) ? ATTACK : (talkingNow ? RELEASE : RELEASE_SILENT);
      jawOpen += (targetOpen - jawOpen) * k;

      const mixerWeight  = USE_MIXER_MOUTH ? (talkingNow ? MOUTH_MIXER_WHEN_TALK : MOUTH_MIXER_WHEN_SILENT) : 0.0;
      const manualWeight = talkingNow ? MOUTH_MANUAL_WHEN_TALK : MOUTH_MANUAL_WHEN_SILENT;

      if (actionMouth) {
        const cur = actionMouth.getEffectiveWeight();
        actionMouth.setEffectiveWeight(cur + (mixerWeight - cur) * 0.2);
      }

      if (mixerWeight > 0) applyMixerAdditives(clamp01(jawOpen));

      if (jawOpen >= 0.02) {
        applyMouth(clamp01(jawOpen * manualWeight));
      } else if (!talkingNow && mixerWeight === 0) {
        jawOpen = 0;
        resetMouthPose();
      }

      // sello de labios: más fuerte cuanto más cerrada la boca
      const smoothstep = (a,b,x)=> {
        const tt = Math.min(1, Math.max(0, (x-a)/(b-a)));
        return tt*tt*(3-2*tt);
      };
      const sealK = 1.0 - smoothstep(1.08, 0.18, jawOpen);
      applySeal(Math.min(1, Math.max(0, sealK)));

      applyTongue(t, clamp01(jawOpen));

      if (talkingNow && jawOpen > 0) applyArmsWhileTalking(t, clamp01(jawOpen));
      else { (ARM_L||[]).forEach(n=> restore(n)); (ARM_R||[]).forEach(n=> restore(n)); }

      applyTentacles(t, talkingNow ? clamp01(jawOpen) : 0);
      applyEyesIdle();
      applyHeadAndBodyIdle(t);

      openTxt.textContent = jawOpen.toFixed(2);
      lvlTxt.textContent  = levelOut.toFixed(2);
      lvlBar.style.width  = Math.min(100, levelOut*100) + '%';
      talkDot.classList.toggle('on', talkingNow);

      controls.update();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    async function listMicsInit(){ try{ await navigator.mediaDevices.getUserMedia({audio:true}); }catch{} }
    listMicsInit().finally(listMics);
  </script>
</body>
</html>
